<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skikkh.github.io</title>
<meta name="description" content="skikkh がつくった地図">
<style>
  :root { color-scheme: light dark; --bg: #f2ece0; --text: #24201b; --mute: #7a6f60; --line: rgba(36,32,27,.16); --accent: #c7361f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f19; --text: #f2e9d8; --mute: #9c947f; --line: rgba(242,233,216,.16); --accent: #ff6a4a; } }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.7 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
  h1 { margin: 0 0 32px; font: 700 15px/1 ui-monospace, monospace; letter-spacing: .06em; color: var(--mute); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: block; padding: 20px 0; color: inherit; text-decoration: none; }
  a b { display: block; font: 800 22px/1.4 "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .04em; }
  a span { color: var(--mute); font-size: 14px; }
  a:hover b { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>skikkh.github.io</h1>
  <ul>
    <li><a href="nonbei/"><b>東京のんべえ地図</b><span>立ち飲み・角打ち・せんべろ・横丁を、人と話しやすいかで探す夜の地図</span></a></li>
    <li><a href="tokyo-sumika/"><b>東京圏すみか図鑑</b><span>駅ごとの住みやすさを比べる地図</span></a></li>
  </ul>
</main>
</body>
</html>
